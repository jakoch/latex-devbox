name: Release

on:
  # You can manually run this workflow.
  workflow_dispatch:
  # This workflow runs on pushing a semantic versionized tag (e.g. v1.0.0).
  # This workflow does not run when pushing to the main branch.
  push:
    #branches:
    #  - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # This workflow runs on schedule: every Sunday at 1 am.
  schedule:
    - cron: "0 1 * * 0"

env:
  DOCKERHUB_IMAGE: ${{ github.repository }}
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------------------

  build:
    # ---------------------------------------------------------------------------------------

    name: "Build Container"
    # https://github.com/actions/runner-images
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      security-events: write # required for trivy-action

    strategy:
      fail-fast: false
      matrix:
        config:
          #- { platforms: "linux/amd64", debian_codename: "bookworm", debian_version: "12"}
          # Note: both platforms are built in a single buildx invocation. Building
          # them as separate matrix entries would make each push overwrite the
          # other's manifest list for the same tags, so only one arch would survive.
          - {
              platforms: "linux/amd64,linux/arm64",
              debian_codename: "trixie",
              debian_version: "13"
            }

    steps:
      - name: ✂️ Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1 # https://github.com/jlumbroso/free-disk-space
        with:
          tool-cache: true
          docker-images: false

      - name: 🤘 Checkout Code
        uses: actions/checkout@v6 # https://github.com/actions/checkout

      - name: 🔍 Run hadolint
        uses: hadolint/hadolint-action@v3.5.0 # https://github.com/hadolint/hadolint-action
        with:
          dockerfile: .devcontainer/debian/${{ matrix.config.debian_codename }}/Dockerfile

      - name: 🔒 Login to Github Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3 # https://github.com/docker/login-action
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 💽 Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # amd64 is native to the runner, only arm64 needs emulation
          platforms: linux/arm64

      - name: 🔽 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # latex-devbox:{debian_codename}-{{date}}                # only on scheduled builds
      # latex-devbox:{debian_codename}-{{version}}             # only on git tag
      # latex-devbox:{debian_codename}-{{major}}.{{minor}}     # only on git tag
      # latex-devbox:{debian_codename}-{{date}}-sha-{{sha}}    # only on push, not when tagging
      # latex-devbox:{debian_codename}-latest                  # always
      - name: ✏ Setup Docker Metadata
        id: metadata-base
        uses: docker/metadata-action@v5 # https://github.com/docker/metadata-action
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=auto
            prefix=${{ matrix.config.debian_codename }}-
          tags: |
            type=schedule,pattern={{ date 'YYYYMMDD' }}
            type=semver,pattern={{ version }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=raw,value={{ date 'YYYYMMDD' }}-sha-{{ sha }},enabled=${{ github.event_name == 'push' }}
            type=raw,value=latest

      - name: ✏ Create info.json
        run: |
          jq -n --arg version "${{ github.ref_name }}" \
                --arg commit "${{ github.sha }}" \
                --arg date "$(date -u +%F)" \
                '{ version: $version, commit: $commit, date: $date }' > info-${{ matrix.config.debian_codename }}.json

      # Build Image -> Stage: latex-devbox-final
      # Note: multi-platform images must be pushed directly; "load: true" cannot
      # import a manifest list into the local docker image store.
      - name: 📦 🚀 Build and Push
        id: build-base
        uses: docker/build-push-action@v6 # https://github.com/docker/build-push-action
        with:
          context: .
          file: .devcontainer/debian/${{ matrix.config.debian_codename }}/Dockerfile
          target: latex-devbox-final
          platforms: ${{ matrix.config.platforms }}
          tags: ${{ steps.metadata-base.outputs.tags }}
          labels: ${{ steps.metadata-base.outputs.labels }}
          push: true

      - name: 🐳 Inspect the published image manifests
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ matrix.config.debian_codename }}-latest

      - name: 📦 Provide the version info and info.json as a release asset
        uses: actions/upload-artifact@v6 # https://github.com/actions/upload-artifact
        with:
          name: version-info-${{ matrix.config.debian_codename }}
          path: |
            info-${{ matrix.config.debian_codename }}.json

      - name: 🛡️🔍 Scan Image for Vulnerabilities using Trivy
        uses: aquasecurity/trivy-action@v0.36.0 # https://github.com/aquasecurity/trivy-action
        with:
          image-ref: '${{ env.GHCR_IMAGE }}:${{ matrix.config.debian_codename }}-latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # Report-only for now: a base image with the full TeX Live tree will
          # always carry some inherited Debian CVEs, so failing the build on them
          # is not actionable yet. Promote exit-code to '1' once a reviewed
          # baseline/allowlist exists.
          exit-code: '0'
          skip-files: /etc/ssh/ssh_host_rsa_key
        # Notes for the skips:
        # - skip-files: /etc/ssh/ssh_host_rsa_key
        #   The file is skipped, because its reported as "Asymmetric Private Key" alert.
        #   This is a false positive, because the file is a private key, which is intended to be there.

      - name: 🛡️🔼 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4 # https://github.com/github/codeql-action
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🛡️🔍 Scan Image for Vulnerabilities using Dockle
        if: always()
        uses: goodwithtech/dockle-action@v0.4.15 # https://github.com/goodwithtech/dockle-action
        with:
          image: '${{ env.GHCR_IMAGE }}:${{ matrix.config.debian_codename }}-latest'
          format: 'list'
          # Fail on hard errors only. 'warn' would also fail on the many advisory
          # checks a TeX Live image trips, which are not all worth acting on.
          exit-code: '1'
          exit-level: 'error'

  test-image:

    name: Test LaTeX Document
    runs-on: ubuntu-24.04
    needs: build

    strategy:
      fail-fast: false
      matrix:
        config:
          #- { arch: "amd64", debian_codename: "bookworm", debian_version: "12"}
          - {
              arch: "amd64",
              debian_codename: "trixie",
              debian_version: "13"
            }
          - {
              arch: "arm64",
              debian_codename: "trixie",
              debian_version: "13"
            }

    steps:
      - name: 🤘 Checkout Code
        uses: actions/checkout@v6

      - name: 💽 Setup QEMU
        if: matrix.config.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: 🔽 Pull Docker Image from GitHub Container Registry
        run: |
          docker pull --platform linux/${{ matrix.config.arch }} \
            ${{ env.GHCR_IMAGE }}:${{ matrix.config.debian_codename }}-latest

      - name: 📄 ✅ Test rendering a LaTeX document
        if: matrix.config.arch == 'amd64'
        run: |
          docker run --rm \
          --platform linux/amd64 \
          --user $(id -u):$(id -g) \
          -v $(pwd)/latex-demo:/workdir \
          ${{ env.GHCR_IMAGE }}:${{ matrix.config.debian_codename }}-latest \
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/workdir /workdir/demo.tex

      - name: 📂 List Files in latex-demo
        if: matrix.config.arch == 'amd64'
        run: |
          ls -l latex-demo/

      - name: 🔍 ✅ Smoke test the downloaded binaries (emulated arm64)
        # A full pdflatex run under QEMU emulation is very slow, so arm64 only
        # verifies that the natively compiled downloads (JDK, ltex-ls-plus,
        # tex-fmt) and the TeX installation start up on that architecture.
        if: matrix.config.arch == 'arm64'
        run: |
          docker run --rm \
          --platform linux/arm64 \
          ${{ env.GHCR_IMAGE }}:${{ matrix.config.debian_codename }}-latest \
          bash -c 'set -e; \
            uname -m; \
            java -version; \
            tex-fmt --version; \
            pdflatex --version; \
            ltex-cli-plus --version; \
            tlmgr --version; \
            latexmk --version'

      - name: 🔼 Upload PDF Output
        if: matrix.config.arch == 'amd64'
        uses: actions/upload-artifact@v6 # https://github.com/actions/upload-artifact
        with:
          name: latex-output
          path: latex-demo/
